# EXPLICIT-INVOCATION ablation for Nutlope/hallmark.
#
# Derived from suites/hallmark.ablation.suite.yaml by one change: every page
# prompt starts with "Use the hallmark skill." The assertions, fixtures,
# control case and N are byte-identical to that file. Why: in the organic
# round the skill activated 0/12, so the arms did not differ; named, it
# activated 3/3.
#
# Validity cost, stated rather than hidden: in arm B the prompt asks for a
# skill that is not installed. The request itself - the same brief, the same
# instructions, the same words - is unchanged; what differs is only whether
# the named skill exists to answer it.
#
# --- original header follows ---
# Ablation for Nutlope/hallmark: does the skill change what gets built?
#
# Not a trigger measurement. The same four tasks run in two arms that differ
# only in whether the skill exists:
#   A: --skill ./skills/hallmark          (the skill, unmodified)
#   B: --skill ./skills/hallmark-absent   (same plugin name, no skills in it)
# Same suite file, fixtures, prompts, model and N in both arms.
#
# Output is scored with deterministic checks only - no LLM judge. Each check is
# a named tell from hallmark's own references/anti-patterns.md, written as a
# regex. assay's file_content_matches has no negation, so each assertion is
# "no .html (or .css) file contains the tell": a negative lookahead.
# Assertion order is fixed and mapped back to rules by
# tools/hallmark-ablation.mjs (SLOTS); do not reorder by hand - regenerate with
#   node tools/hallmark-ablation.mjs suite
#
# The expect.triggered: true on each page case is only meaningful in arm A. In
# arm B the skill does not exist, so that check fails by construction; the
# assertions are what the two arms are compared on.

version: 1

target:
  skill: hallmark:hallmark
  source: Nutlope/hallmark@13ac0ec7e148655948100b6396439e481361d690

environment:
  host: claude-code
  model: claude-haiku-4-5-20251001
  system_prompt_hash: not-provided-by-host
  active_skills: [hallmark:hallmark]

runs: 10

cases:
  - id: ablation.page.devtool
    prompt: >-
      Use the hallmark skill. Read brief.md and build the landing page it describes as a static site: HTML and CSS only, no build step and no dependencies. Put the page in index.html.
    setup: { fixtures: ../fixtures/hallmark/devtool }
    expect:
      triggered: true
      assertions: &rules
        - { type: file_exists, path: '**/*.html' }
        - { type: file_content_matches, path: '**/*.html', matches: '^(?![\s\S]*(?:background-clip\s*:\s*text|\bbg-clip-text\b))', flags: 'i' }
        - { type: file_content_matches, path: '**/*.css', matches: '^(?![\s\S]*(?:background-clip\s*:\s*text|\bbg-clip-text\b))', flags: 'i' }
        - { type: file_content_matches, path: '**/*.html', matches: '^(?![\s\S]*(?:#(?:000000|ffffff|000|fff)(?![0-9a-f])|rgba?\(\s*(?:0\s*,\s*0\s*,\s*0|255\s*,\s*255\s*,\s*255)\s*[,)]|\b(?:bg|text)-(?:white|black)\b|:\s*(?:white|black)\s*[;!}]))', flags: 'i' }
        - { type: file_content_matches, path: '**/*.css', matches: '^(?![\s\S]*(?:#(?:000000|ffffff|000|fff)(?![0-9a-f])|rgba?\(\s*(?:0\s*,\s*0\s*,\s*0|255\s*,\s*255\s*,\s*255)\s*[,)]|\b(?:bg|text)-(?:white|black)\b|:\s*(?:white|black)\s*[;!}]))', flags: 'i' }
        - { type: file_content_matches, path: '**/*.html', matches: '^(?![\s\S]*(?:transition\s*:\s*(?:all\b|[\d.]+m?s\b)|transition-property\s*:\s*all\b|\btransition-all\b))', flags: 'i' }
        - { type: file_content_matches, path: '**/*.css', matches: '^(?![\s\S]*(?:transition\s*:\s*(?:all\b|[\d.]+m?s\b)|transition-property\s*:\s*all\b|\btransition-all\b))', flags: 'i' }
        - { type: file_content_matches, path: '**/*.html', matches: '^(?![\s\S]*(?:\bhover:scale-\d+|:hover[^{}]*\{[^}]*scale\(\s*1\.\d))', flags: 'i' }
        - { type: file_content_matches, path: '**/*.css', matches: '^(?![\s\S]*(?:\bhover:scale-\d+|:hover[^{}]*\{[^}]*scale\(\s*1\.\d))', flags: 'i' }
        - { type: file_content_matches, path: '**/*.html', matches: '^(?![\s\S]*(?:z-index\s*:\s*9{4,}|\bz-\[9{4,}\]))' }
        - { type: file_content_matches, path: '**/*.css', matches: '^(?![\s\S]*(?:z-index\s*:\s*9{4,}|\bz-\[9{4,}\]))' }
        - { type: file_content_matches, path: '**/*.html', matches: '^(?![\s\S]*(?:width\s*:\s*100vw|\bw-screen\b))', flags: 'i' }
        - { type: file_content_matches, path: '**/*.css', matches: '^(?![\s\S]*(?:width\s*:\s*100vw|\bw-screen\b))', flags: 'i' }
        - { type: file_content_matches, path: '**/*.html', matches: '^(?![\s\S]*(?:[✨🚀⚡🔥🎯✅]))', flags: 'u' }
        - { type: file_content_matches, path: '**/*.css', matches: '^(?![\s\S]*(?:[✨🚀⚡🔥🎯✅]))', flags: 'u' }
        - { type: file_content_matches, path: '**/*.html', matches: '^(?![\s\S]*(?:Jane Doe|John Smith|Example User))', flags: 'i' }
        - { type: file_content_matches, path: '**/*.css', matches: '^(?![\s\S]*(?:Jane Doe|John Smith|Example User))', flags: 'i' }
        - { type: file_content_matches, path: '**/*.html', matches: '^(?![\s\S]*(?:<h[1-3]\b[^>]*>(?:(?!</h[1-3]>)[\s\S])*?(?:<em\b|<i>)|h[1-3]\b[^{};]*\{[^}]*font-style\s*:\s*italic))', flags: 'i' }
        - { type: file_content_matches, path: '**/*.css', matches: '^(?![\s\S]*(?:<h[1-3]\b[^>]*>(?:(?!</h[1-3]>)[\s\S])*?(?:<em\b|<i>)|h[1-3]\b[^{};]*\{[^}]*font-style\s*:\s*italic))', flags: 'i' }
        - { type: file_content_matches, path: '**/*.html', matches: '^(?![\s\S]*(?:(?:linear|radial|conic)-gradient\([^;]*?(?:purple|violet|indigo|fuchsia|magenta|#(?:8b5cf6|7c3aed|6d28d9|a855f7|9333ea|6366f1|4f46e5|c026d3|d946ef|a78bfa|818cf8|c084fc|e879f9))|\b(?:from|via|to)-(?:purple|violet|indigo|fuchsia)-\d{2,3}\b))', flags: 'i' }
        - { type: file_content_matches, path: '**/*.css', matches: '^(?![\s\S]*(?:(?:linear|radial|conic)-gradient\([^;]*?(?:purple|violet|indigo|fuchsia|magenta|#(?:8b5cf6|7c3aed|6d28d9|a855f7|9333ea|6366f1|4f46e5|c026d3|d946ef|a78bfa|818cf8|c084fc|e879f9))|\b(?:from|via|to)-(?:purple|violet|indigo|fuchsia)-\d{2,3}\b))', flags: 'i' }
        - { type: file_content_matches, path: '**/*.html', matches: '^(?![\s\S]*(?:font-family\s*:\s*[''"]?(?:Inter|Roboto|Open Sans)\b|--[\w-]*font[\w-]*\s*:\s*[''"]?(?:Inter|Roboto|Open Sans)\b|family=(?:Inter|Roboto|Open\+Sans)\b|\bfont-(?:inter|roboto)\b))', flags: 'i' }
        - { type: file_content_matches, path: '**/*.css', matches: '^(?![\s\S]*(?:font-family\s*:\s*[''"]?(?:Inter|Roboto|Open Sans)\b|--[\w-]*font[\w-]*\s*:\s*[''"]?(?:Inter|Roboto|Open Sans)\b|family=(?:Inter|Roboto|Open\+Sans)\b|\bfont-(?:inter|roboto)\b))', flags: 'i' }
        - { type: file_content_matches, path: '**/*.html', matches: '^(?![\s\S]*(?:backdrop-filter\s*:\s*blur|\bbackdrop-blur\b))', flags: 'i' }
        - { type: file_content_matches, path: '**/*.css', matches: '^(?![\s\S]*(?:backdrop-filter\s*:\s*blur|\bbackdrop-blur\b))', flags: 'i' }
        - { type: file_content_matches, path: '**/*.html', matches: '^(?![\s\S]*(?:filter\s*:\s*blur\(\s*(?:[4-9]\d|\d{3,})px|\bblur-(?:2xl|3xl)\b))', flags: 'i' }
        - { type: file_content_matches, path: '**/*.css', matches: '^(?![\s\S]*(?:filter\s*:\s*blur\(\s*(?:[4-9]\d|\d{3,})px|\bblur-(?:2xl|3xl)\b))', flags: 'i' }
        - { type: file_content_matches, path: '**/*.html', matches: '^(?![\s\S]*(?:cubic-bezier\(\s*[^,)]+,\s*(?:-\d*\.?\d+|1\.0*[1-9]\d*|[2-9]\d*(?:\.\d+)?)\s*,|cubic-bezier\(\s*[^,)]+,[^,)]+,[^,)]+,\s*(?:-\d*\.?\d+|1\.0*[1-9]\d*|[2-9]\d*(?:\.\d+)?)\s*\)|\banimate-bounce\b|@keyframes\s+[\w-]*(?:bounce|elastic|wobble)))', flags: 'i' }
        - { type: file_content_matches, path: '**/*.css', matches: '^(?![\s\S]*(?:cubic-bezier\(\s*[^,)]+,\s*(?:-\d*\.?\d+|1\.0*[1-9]\d*|[2-9]\d*(?:\.\d+)?)\s*,|cubic-bezier\(\s*[^,)]+,[^,)]+,[^,)]+,\s*(?:-\d*\.?\d+|1\.0*[1-9]\d*|[2-9]\d*(?:\.\d+)?)\s*\)|\banimate-bounce\b|@keyframes\s+[\w-]*(?:bounce|elastic|wobble)))', flags: 'i' }
  - id: ablation.page.bakery
    prompt: >-
      Use the hallmark skill. Read brief.md and build the landing page it describes as a static site: HTML and CSS only, no build step and no dependencies. Put the page in index.html.
    setup: { fixtures: ../fixtures/hallmark/bakery }
    expect:
      triggered: true
      assertions: *rules
  - id: ablation.page.studio
    prompt: >-
      Use the hallmark skill. Read brief.md and build the landing page it describes as a static site: HTML and CSS only, no build step and no dependencies. Put the page in index.html.
    setup: { fixtures: ../fixtures/hallmark/studio }
    expect:
      triggered: true
      assertions: *rules
  - id: ablation.page.event
    prompt: >-
      Use the hallmark skill. Read brief.md and build the landing page it describes as a static site: HTML and CSS only, no build step and no dependencies. Put the page in index.html.
    setup: { fixtures: ../fixtures/hallmark/event }
    expect:
      triggered: true
      assertions: *rules

  # assay rejects a suite with no negative case. This one is also a useful
  # control: hallmark should not fire on work with no interface in it.
  - id: trigger.negative.unrelated.slow_query
    prompt: >-
      This Postgres query for monthly revenue takes 12 seconds on 4M rows.
      Work out which index it is missing.
    expect: { triggered: false }

