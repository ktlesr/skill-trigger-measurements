# Trigger discrimination for the `better-typography` skill.
#
# The description is a keyword list: "type scale, spacing, sizing, variable
# fonts, OpenType features, wrapping, truncation and other details". The
# near-neighbour cases each land on one of those keywords while asking for
# something that is not a type decision — a signed-off value change, a copy
# rewrite, font-file plumbing, server-side string truncation. No prompt names
# the skill.

version: 1

target:
  skill: better-typography
  source: jakubkrehel/skills@267330e1adfc66a718fb65fa6918c1f06d0a689e

environment:
  host: claude-code
  model: claude-haiku-4-5-20251001
  system_prompt_hash: not-provided-by-host
  active_skills: [better-typography]

runs: 10

cases:
  # ---- positives: a real type decision ----------------------------------
  - id: trigger.positive.ad_hoc_sizes
    prompt: >-
      src/app.css has eight text sizes that were each picked by eye. Replace
      them with a proper scale and move every class onto it.
    setup: { fixtures: ../fixtures/typography-app }
    expect: { triggered: true }

  - id: trigger.positive.measure_and_widows
    prompt: >-
      In src/article.tsx the paragraph runs the full 1400px and the heading
      leaves one word alone on the last line. Make this comfortable to read.
    setup: { fixtures: ../fixtures/typography-app }
    expect: { triggered: true }

  - id: trigger.positive.variable_font_numerals
    prompt: >-
      We just moved to a variable family. The numbers in src/dashboard.tsx
      jitter as they update and the weights are all over the place. Set the
      face up properly for these tables.
    setup: { fixtures: ../fixtures/typography-app }
    expect: { triggered: true }

  # ---- near neighbours: touches type, asks for no type decision ---------
  - id: trigger.negative.near_neighbor.signed_off_value
    prompt: >-
      In src/app.css the .price rule says font-size 14px. Design signed off
      on 16px. Change that one value and nothing else.
    setup: { fixtures: ../fixtures/typography-app }
    expect: { triggered: false }

  - id: trigger.negative.near_neighbor.copy_rewrite
    prompt: >-
      The headline in src/hero.tsx is a mouthful. Rewrite the words to be
      shorter and punchier. Leave every style exactly as it is.
    setup: { fixtures: ../fixtures/typography-app }
    expect: { triggered: false }

  - id: trigger.negative.near_neighbor.font_file_plumbing
    prompt: >-
      Fetch the Inter woff2 files into public/fonts/ and wire up the
      @font-face blocks that point at them. Keep every existing rule as is.
    setup: { fixtures: ../fixtures/typography-app }
    expect: { triggered: false }

  - id: trigger.negative.near_neighbor.server_side_truncate
    prompt: >-
      The vendor feed sends product titles up to 300 characters. In
      src/api.ts, cut them to 80 characters on a word boundary before they go
      out of listProducts.
    setup: { fixtures: ../fixtures/typography-app }
    expect: { triggered: false }

  # ---- unrelated --------------------------------------------------------
  - id: trigger.negative.unrelated.rate_limit
    prompt: >-
      Put rate limiting on the /login endpoint: five attempts per minute per
      IP, then a 429.
    expect: { triggered: false }

  - id: trigger.negative.unrelated.docker_build
    prompt: >-
      Our Docker image takes nine minutes to build. Work out where the time
      goes and cut it down.
    expect: { triggered: false }

  # ---- completion -------------------------------------------------------
  - id: complete.writes_scale_tokens
    prompt: >-
      src/app.css has no system behind its text sizes. Define a named scale
      as CSS custom properties in a new file src/type-scale.css, and point
      the classes in app.css at it.
    setup: { fixtures: ../fixtures/typography-app }
    expect:
      triggered: true
      assertions:
        - { type: file_exists, path: 'src/type-scale.css' }
        - { type: trace, rule: no_swallowed_errors }
