<!doctype html>
<html><head><title>Create your Meterly account</title></head>
<body>
  <h1>Create account</h1>
  <form id="register">
    <input name="first" placeholder="First name"><input name="last" placeholder="Last name">
    <input name="company" placeholder="Company"><input name="role" placeholder="Job title">
    <input name="phone" placeholder="Phone"><input name="size" placeholder="Company size">
    <input name="addr" placeholder="Work address"><input name="pw" type="password" placeholder="Password">
    <input name="pw2" type="password" placeholder="Repeat password">
    <label><input type="checkbox" name="tos"> I agree to the terms</label>
    <button>Submit</button>
  </form>
  <script>document.querySelector('#promo').value.trim();</script>
</body></html>
